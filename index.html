<script>'use strict';
const initial=JSON.parse(document.getElementById('portfolio-data').textContent);
const key='hyeonah-portfolio-local-v1';
let content=structuredClone(initial),draft;
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const lines=v=>String(v).split(/\n+/).filter(Boolean);
const safeURL=(v,kind)=>{try{const u=new URL(v);return (kind==='email'?u.protocol==='mailto:':u.protocol==='https:'||u.protocol==='http:')?esc(v):'#'}catch{return '#'}};
function notify(message){document.getElementById('local-status').textContent=message}
try{const saved=localStorage.getItem(key);if(saved){const c=JSON.parse(saved);validate(c);content=c}}catch{}
function validate(c){
 if(!c||typeof c!=='object'||Array.isArray(c))throw Error('Please select a valid portfolio JSON file.');
 const check=(v,t)=>{if(Array.isArray(t)){if(!Array.isArray(v)||v.length>30)throw Error('Invalid list.');for(const x of v)check(x,t[0])}else if(t&&typeof t==='object'){if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Invalid section.');for(const k of Object.keys(t))check(v[k],t[k])}else if(typeof v!=='string'||v.length>10000)throw Error('Invalid text field.')};
 check(c,initial);return c;
}
function render(){const c=content;
 document.title=c.name+' | Portfolio';
 document.getElementById('site').innerHTML=`<header id="top"><div class="wrap"><nav aria-label="Main navigation"><a class="brand" href="#top">${esc(c.name)}</a><div class="navlinks">${[['work','Selected work'],['experience','Experience'],['research','Research'],['skills','Skills'],['contact','Contact']].map(([id,title])=>`<a href="#${id}">${title}</a>`).join('')}</div><button class="edit-toggle" id="edit-page">Edit page</button></nav><div class="hero"><div><div class="hero-identity"><img class="hero-portrait" src="${window.PORTFOLIO_IMAGES.portrait}" alt="${esc(c.name)}" width="355" height="474"><div><div class="eyebrow">${esc(c.eyebrow)}</div><h1>${esc(c.name)}</h1></div></div><p class="intro">${esc(c.intro)}</p><p class="bridge-line">${esc(c.bridgeLine)}</p><div class="hero-actions"><a class="button primary" href="#work">Explore selected work</a><a class="button" href="#contact">Get in touch</a></div></div><aside class="hero-side" aria-label="Professional focus">${c.focus.map(x=>`<p class="focus-item">${esc(x)}</p>`).join('')}<div class="education"><span>Education</span>${lines(c.education).map(x=>`<p>${esc(x)}</p>`).join('')}</div></aside></div></div></header><main>
<section aria-labelledby="impact-title"><div class="wrap"><div class="section-head"><span class="label">At a glance</span><h2 id="impact-title">${esc(c.impactTitle)}</h2></div><div class="stats">${c.stats.map(x=>`<div class="stat"><b>${esc(x.value)}</b><span>${esc(x.detail)}</span></div>`).join('')}</div></div></section>
<section id="work"><div class="wrap"><div class="section-head"><span class="label">Selected work</span><div><h2>${esc(c.workTitle)}</h2><p class="lead">${esc(c.workLead)}</p></div></div><div class="cases">${c.cases.map(x=>{const lao=x.meta.toLowerCase().includes('lao');return `<article class="case"><div class="meta">${esc(x.meta)}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="case-details ${lao?'with-photo':''}">${lao?`<figure class="case-photo"><img src="${window.PORTFOLIO_IMAGES.presentation}" alt="Hyeon-Ah Shin presenting with project partners in Lao PDR" loading="lazy"><figcaption>Presenting with project partners in Lao PDR</figcaption></figure>`:''}<ul>${x.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div><div class="scope">${esc(x.scope)}</div></article>`}).join('')}</div></div></section>
<section id="experience"><div class="wrap"><div class="section-head"><span class="label">Experience</span><h2>${esc(c.experienceTitle)}</h2></div><div class="timeline">${c.roles.map(x=>`<article class="role"><time>${esc(x.dates)}</time><div><h3>${esc(x.title)}</h3><p class="organisation">${esc(x.organisation)}</p><p>${esc(x.detail)}</p></div></article>`).join('')}</div></div></section>
<section id="research"><div class="wrap"><div class="research-label label">Research</div><article class="research-card"><div class="research-meta">${esc(c.research.label)}</div><h3>${esc(c.research.title)}</h3><p>${esc(c.research.summary)}</p><div class="research-methods">${c.research.methods.split(',').filter(Boolean).map(x=>`<span>${esc(x.trim())}</span>`).join('')}</div></article></div></section>
<section id="skills"><div class="wrap"><div class="section-head"><span class="label">Skills</span><h2>${esc(c.expertiseTitle)}</h2></div><div class="expertise">${c.expertise.map(x=>`<article><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></article>`).join('')}</div><div class="skill-grid">${c.skills.map(x=>`<article class="skill-group"><h3>${esc(x.category)}</h3><ul>${x.items.split(',').filter(Boolean).map(i=>`<li>${esc(i.trim())}</li>`).join('')}</ul></article>`).join('')}</div></div></section>
<section id="contact" class="contact"><div class="wrap"><div class="section-head"><span class="label">Contact</span><div><h2>${esc(c.contactTitle)}</h2><p class="lead">${esc(c.contactLead)}</p></div></div><div class="contact-links"><a href="${safeURL('mailto:'+c.email,'email')}">Email Hyeon-Ah</a><a href="${safeURL(c.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn profile ↗</a></div></div></section></main><footer><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(c.name)}</span><span>Global health · Programmes · Evidence</span></div></footer>`;
 document.getElementById('edit-page').onclick=openEditor;
}
const titles={name:'Name',eyebrow:'Specialism',intro:'Introduction',bridgeLine:'Grant-to-field statement',focus:'Professional focus',education:'Education (one degree per line)',impactTitle:'At a glance heading',stats:'Key figures',workTitle:'Selected work heading',workLead:'Selected work introduction',cases:'Selected projects',experienceTitle:'Experience heading',roles:'Career history',research:'Research',expertiseTitle:'Skills heading',expertise:'Areas of expertise',skills:'Skill groups',contactTitle:'Contact heading',contactLead:'Contact introduction',email:'Email',linkedin:'LinkedIn URL',meta:'Location / theme',title:'Title',summary:'Summary',bullets:'Responsibilities',scope:'Role / organisation',dates:'Dates',organisation:'Organisation',detail:'Description',value:'Figure',label:'Label',methods:'Methods (comma separated)',category:'Category',items:'Items (comma separated)'};
let lastFocus;
function openEditor(){lastFocus=document.activeElement;draft=structuredClone(content);buildEditor();document.getElementById('editor-modal').hidden=false;document.getElementById('close-editor').focus();document.body.style.overflow='hidden'}
function closeEditor(){document.getElementById('editor-modal').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
function buildEditor(){const root=document.getElementById('fields');root.replaceChildren();
 function field(parent,obj,k,path){const v=obj[k],title=titles[k]||k;
  if(Array.isArray(v)){const box=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=title;box.append(legend);v.forEach((item,i)=>{const row=document.createElement('div');row.className='edit-group';if(item&&typeof item==='object'){for(const kk of Object.keys(item))field(row,item,kk,[...path,k,i])}else field(row,v,i,[...path,k]);const remove=document.createElement('button');remove.type='button';remove.textContent='Remove';remove.onclick=()=>{v.splice(i,1);buildEditor()};row.append(remove);box.append(row)});const add=document.createElement('button');add.type='button';add.textContent='Add item';add.onclick=()=>{let template=v[0];if(template===undefined){let ref=initial;for(const part of [...path,k])ref=ref?.[part];template=ref?.[0]}const blank=x=>Array.isArray(x)?[]:x&&typeof x==='object'?Object.fromEntries(Object.keys(x).map(kk=>[kk,blank(x[kk])])):'';v.push(blank(template));buildEditor()};box.append(add);parent.append(box)
  }else if(v&&typeof v==='object'){const box=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=title;box.append(legend);for(const kk of Object.keys(v))field(box,v,kk,[...path,k]);parent.append(box)
  }else{const label=document.createElement('label');label.textContent=typeof k==='number'?'Item '+(k+1):title;const input=document.createElement('textarea');input.rows=String(v).length>90||k==='education'?3:2;input.value=v;input.oninput=()=>{obj[k]=input.value};label.append(input);parent.append(label)}
 }
 for(const k of Object.keys(draft))field(root,draft,k,[]);
}
function download(text,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function save(){try{validate(draft);content=structuredClone(draft);let message='Saved in this browser.';try{localStorage.setItem(key,JSON.stringify(content))}catch{message='Applied to this page. Browser storage is unavailable: download HTML or JSON to keep your changes.'}render();closeEditor();notify(message)}catch(e){document.getElementById('editor-error').textContent=e.message}}
function exportHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#portfolio-data').textContent=JSON.stringify(content).replace(/</g,'\\u003c');copy.querySelector('#site').innerHTML='';copy.querySelector('#fields').innerHTML='';copy.querySelector('#editor-modal').hidden=true;copy.querySelector('body').style.overflow='';copy.querySelector('#local-status').textContent='';download('<!DOCTYPE html>\n'+copy.outerHTML,'Hyeon-Ah-Shin-Portfolio.html','text/html;charset=utf-8');notify('HTML downloaded with your current content and both photos.')}
document.getElementById('close-editor').onclick=closeEditor;
document.getElementById('save-content').onclick=save;
document.getElementById('export-json').onclick=()=>download(JSON.stringify(content,null,2),'portfolio-data.json','application/json');
document.getElementById('export-html').onclick=exportHTML;
document.getElementById('import-json').onclick=()=>document.getElementById('json-file').click();
document.getElementById('json-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('Please select a file smaller than 1 MB.');const c=JSON.parse(await file.text());validate(c);content=c;try{localStorage.setItem(key,JSON.stringify(c))}catch{}render();notify('JSON imported.')}catch(err){notify('Import failed: '+err.message)}finally{e.target.value=''}};
document.getElementById('reset-content').onclick=()=>{if(confirm('Restore the content embedded in this HTML file? Current browser edits will be replaced.')){content=structuredClone(initial);try{localStorage.removeItem(key)}catch{}render();notify('Original file content restored.')}};
document.addEventListener('keydown',e=>{const modal=document.getElementById('editor-modal');if(modal.hidden)return;if(e.key==='Escape'){closeEditor();return}if(e.key==='Tab'){const items=[...modal.querySelectorAll('button,textarea')].filter(x=>!x.disabled),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script></body></html>
